# Build release binaries on demand and attach them to an existing
# GitHub Release.
#
# Trigger this from the Actions tab (workflow_dispatch) and pass the tag
# of a release that already exists (for example v0.1.0). The job checks
# out that tag, builds the binaries with the version baked in via
# -ldflags, and uploads them as assets to that release so they can be
# downloaded. Re-running for the same tag overwrites the existing assets
# (--clobber), so it is safe to run again.

name: Release binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach binaries to (e.g. v0.1.0)"
        required: true

permissions:
  contents: write       # required to upload assets to the release
  id-token: write       # required for keyless signing of the provenance
  attestations: write   # required to record the build provenance

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          # Build from the exact commit the release points at, not the
          # branch the workflow was dispatched from.
          ref: ${{ inputs.tag }}

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Verify the release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null

      - name: Build binaries
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          VERSION="${TAG#v}"   # strip a leading v for the baked-in version
          mkdir -p dist build

          # CGO_ENABLED=0 and -trimpath keep the binaries static and
          # reproducible, matching the distroless build in the spec.
          ldflags="-s -w -X main.version=${VERSION}"

          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            name="oidc-ssh-ca_${VERSION}_${GOOS}_${GOARCH}"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath -ldflags "$ldflags" \
              -o build/oidc-ssh-ca ./cmd/oidc-ssh-ca
            tar -czf "dist/${name}.tar.gz" -C build oidc-ssh-ca
            rm build/oidc-ssh-ca
          done

          # Lambda artifacts: the function runs the ordinary binary behind
          # the AWS Lambda Web Adapter, started by run.sh (the handler).
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath -ldflags "$ldflags" \
              -o build/oidc-ssh-ca ./cmd/oidc-ssh-ca
            cp examples/lambda/run.sh build/run.sh
            chmod +x build/run.sh
            (cd build && zip -q "../dist/oidc-ssh-ca_${VERSION}_lambda_${arch}.zip" oidc-ssh-ca run.sh)
            rm build/oidc-ssh-ca build/run.sh
          done

          (cd dist && sha256sum * > checksums.txt)
          echo "----- artifacts -----"
          ls -la dist

      # Generate SLSA build provenance for every released archive. The
      # attestation is signed keyless via Sigstore (using the id-token
      # above) and recorded in the public transparency log, so consumers
      # can verify a binary was built by this workflow from this repo with
      #   gh attestation verify <artifact> --repo <owner>/<repo>
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      - name: Upload artifacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" dist/* --clobber --repo "$GITHUB_REPOSITORY"
