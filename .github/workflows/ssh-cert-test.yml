# Manual test: request a short-lived SSH certificate from the deployed
# Cloud Run instance of oidc-ssh-ca, then use it to run a command on the
# target server dev.aish.dev (login user "deploy").
#
#   ephemeral key -> real GitHub OIDC token -> POST /sign -> certificate
#   -> ssh deploy@dev.aish.dev 'command'
#
# Unlike e2e-selftest.yml (which runs both the CA and sshd inside the
# runner), this hits the live Cloud Run endpoint and a real server whose
# sshd trusts only the CA public key (configured by the oidc_ssh_ca_trust
# Ansible role in gcloud-test/ansible/).
#
# Prerequisites:
#   - This file must be on the default branch (main) so workflow_dispatch
#     can run it; the CA policy pins job_workflow_ref to this file @ main.
#   - The CA policy (gcloud-test/policy.yaml) rule must match the claims
#     this workflow produces: audience ssh-ca-test, repository, ref,
#     event_name=workflow_dispatch, job_workflow_ref.
#   - dev.aish.dev trusts the CA and maps principal gha-test -> deploy.

name: SSH cert test (Cloud Run)

on:
  workflow_dispatch:

permissions:
  id-token: write   # required to request a GitHub Actions OIDC token
  contents: read

env:
  # Deployed Cloud Run service URL. Override by setting a repo variable
  # OIDC_SSH_CA_URL; this default keeps the test runnable with no setup.
  OIDC_SSH_CA_URL: ${{ vars.OIDC_SSH_CA_URL || 'https://oidc-ssh-ca-870123444741.asia-northeast1.run.app' }}
  AUDIENCE: ssh-ca-test
  EXPECT_PRINCIPAL: gha-test
  # dev.aish.dev (AWS Lightsail Tokyo) is reachable from GitHub-hosted
  # runners; mc1.poo999.com has a JP-only firewall that drops foreign IPs.
  TARGET_HOST: dev.aish.dev
  TARGET_USER: deploy

jobs:
  request-cert:
    runs-on: ubuntu-latest
    steps:
      - name: Generate ephemeral SSH key
        run: ssh-keygen -t ed25519 -N "" -f gha_key -C ssh-cert-test

      - name: Get GitHub OIDC token
        run: |
          curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=${AUDIENCE}" \
            | jq -r .value > oidc.jwt
          test -s oidc.jwt

      - name: Request SSH certificate from Cloud Run
        run: |
          jq -n --arg public_key "$(cat gha_key.pub)" \
            '{ public_key: $public_key }' > request.json

          # --fail makes curl exit non-zero on a 4xx/5xx denial so the job
          # fails loudly; the body then carries the generic error+request_id.
          curl -sS --fail-with-body "${OIDC_SSH_CA_URL}/sign" \
            -H "Authorization: Bearer $(cat oidc.jwt)" \
            -H "Content-Type: application/json" \
            --data @request.json \
            -o gha_key-cert.pub

      - name: Show and verify the issued certificate
        run: |
          echo "----- issued certificate -----"
          ssh-keygen -L -f gha_key-cert.pub

          # Assert it really is a certificate, carries the expected
          # principal, and got a key ID built from this run's claims.
          INFO=$(ssh-keygen -L -f gha_key-cert.pub)
          echo "$INFO" | grep -q "Type: ssh-ed25519-cert-v01@openssh.com user certificate"
          echo "$INFO" | grep -q "${EXPECT_PRINCIPAL}"
          echo "$INFO" | grep -q "Key ID: \"gha:${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}\""
          echo "certificate OK"

      - name: Pin the target host key
        run: |
          mkdir -p .ssh
          # Host key obtained out of band (the server's
          # /etc/ssh/ssh_host_ed25519_key.pub). Pinning it means the
          # connection is verified, not trusted on first use.
          cat > .ssh/known_hosts <<'EOF'
          dev.aish.dev ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPiGF930s6PdwcDwG+ofLjkILc+aqBwvZaHtdO6MHMMn
          EOF

      - name: Run a command on mc1.poo999.com
        run: |
          ssh \
            -i gha_key \
            -o CertificateFile=gha_key-cert.pub \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile=./.ssh/known_hosts \
            -o StrictHostKeyChecking=yes \
            "${TARGET_USER}@${TARGET_HOST}" \
            'echo "logged in as $(whoami)@$(hostname)"; uname -a; uptime'
