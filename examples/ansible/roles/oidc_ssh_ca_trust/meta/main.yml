---
galaxy_info:
  role_name: oidc_ssh_ca_trust
  author: oidc-ssh-ca
  description: >-
    Configure an OpenSSH server to trust an oidc-ssh-ca certificate
    authority: install the CA public key, per-user principals files,
    and an sshd_config.d fragment, then validate and reload sshd.
  license: MIT
  min_ansible_version: "2.12"
  platforms:
    - name: Debian
      versions:
        - all
    - name: Ubuntu
      versions:
        - all
    - name: EL
      versions:
        - all
  galaxy_tags:
    - ssh
    - sshd
    - certificate
    - security

dependencies: []
