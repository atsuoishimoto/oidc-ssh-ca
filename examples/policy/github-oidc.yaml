# Example policy: issue certificates to a GitHub Actions deploy workflow.
# Validate with: oidc-ssh-ca check-config github-oidc.yaml

version: 1

# Emergency stop: set to true and reload (SIGHUP) to deny all requests.
disabled: false

defaults:
  valid_after_offset_seconds: -30
  max_valid_for_seconds: 900
  allowed_public_key_types:
    - "ssh-ed25519"

  # Certificates grant nothing beyond authentication unless enabled here.
  extensions:
    permit_pty: false
    permit_port_forwarding: false
    permit_agent_forwarding: false
    permit_x11_forwarding: false
    permit_user_rc: false

rules:
  - name: "prod-deploy"
    enabled: true

    match:
      jwt:
        issuer: "https://token.actions.githubusercontent.com"
        audience: "ssh-ca-prod"
        claims_exact:
          repository: "your-org/your-repo"
          ref: "refs/heads/main"
          # Only present when the job declares `environment:`.
          environment: "production"
          event_name: "push"
          # Pins the exact workflow file; with reusable workflows this
          # is the *called* workflow's ref.
          job_workflow_ref: "your-org/your-repo/.github/workflows/deploy.yml@refs/heads/main"

    certificate:
      principals:
        - "gha-prod-deploy"
      valid_for_seconds: 600
      key_id_template: "gha:${repository}:${run_id}:${run_attempt}"
