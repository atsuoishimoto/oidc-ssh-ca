# Example policy: issue certificates to a GitHub Actions deploy workflow.
# Validate with: oidc-ssh-ca check-config github-oidc.yaml

version: 1

# Emergency stop: set to true and reload (SIGHUP) to deny all requests.
disabled: false

defaults:
  valid_after_offset_seconds: -30
  max_valid_for_seconds: 900
  allowed_public_key_types:
    - "ssh-ed25519"

  # valid_for_seconds, key_id_template, and source_address may also be set
  # here as policy-wide defaults; a rule that omits them inherits these, and
  # a rule that sets them overrides for itself. They are left per-rule below.

  # Certificates grant nothing beyond authentication unless enabled here.
  extensions:
    permit_pty: false
    permit_port_forwarding: false
    permit_agent_forwarding: false
    permit_x11_forwarding: false
    permit_user_rc: false

rules:
  - name: "prod-deploy"
    enabled: true

    match:
      jwt:
        issuer: "https://token.actions.githubusercontent.com"
        audience: "ssh-ca-prod"
        # owner and reponame are the two halves of the `repository` claim
        # (owner/repo), split on the "/". Either may be omitted to leave it
        # unconstrained (e.g. set only owner to allow any repo under the org).
        owner: "your-org"
        reponame: "your-repo"
        claims_exact:
          ref: "refs/heads/main"
          # Only present when the job declares `environment:`.
          environment: "production"
          event_name: "push"
          # Pins the exact workflow file; with reusable workflows this
          # is the *called* workflow's ref.
          job_workflow_ref: "your-org/your-repo/.github/workflows/deploy.yml@refs/heads/main"

    certificate:
      principals:
        - "gha-prod-deploy"
      valid_for_seconds: 600
      key_id_template: "gha:${repository}:${run_id}:${run_attempt}"

      # Optional hardening, enforced by the CA on the certificate itself:
      #   force_command  - the target runs only this command, ignoring
      #                    whatever the client asks for (verbatim; no
      #                    ${claim} expansion).
      #   source_address - the certificate is only usable from these CIDR
      #                    ranges (mainly useful with self-hosted runners).
      # force_command: "/usr/local/bin/deploy.sh"
      # source_address:
      #   - "192.0.2.0/24"
